<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host-Authenticated Game</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "crypto-js": "https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js",
            "jsencrypt": "https://cdn.jsdelivr.net/npm/jsencrypt@3.2.1/dist/jsencrypt.min.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Host-Authenticated Game</h1>
        </header>
        
        <main>
            <div id="auth-panel">
                <div id="setup-host" class="auth-section">
                    <h2>Setup Host Keys</h2>
                    <p>Generate a new host key pair protected by a PIN.</p>
                    <div class="form-group">
                        <label for="setup-pin">Create PIN (4-8 digits):</label>
                        <input type="password" id="setup-pin" placeholder="Enter PIN" maxlength="8" pattern="[0-9]*">
                    </div>
                    <div class="form-group">
                        <label for="setup-confirm-pin">Confirm PIN:</label>
                        <input type="password" id="setup-confirm-pin" placeholder="Confirm PIN" maxlength="8" pattern="[0-9]*">
                    </div>
                    <button id="generate-keys-btn">Generate Host Keys</button>
                    <div id="setup-status" class="status"></div>
                </div>

                <div id="login-host" class="auth-section">
                    <h2>Host Login</h2>
                    <p>Enter your PIN to unlock host privileges.</p>
                    <div class="form-group">
                        <label for="login-pin">Host PIN:</label>
                        <input type="password" id="login-pin" placeholder="Enter PIN" maxlength="8" pattern="[0-9]*">
                    </div>
                    <button id="login-host-btn">Login as Host</button>
                    <div id="login-status" class="status"></div>
                </div>
            </div>

            <div id="game-controls" style="display: none;">
                <div id="host-panel" style="display: none;">
                    <h2>Host Controls</h2>
                    <div id="host-status" class="status success">You are the host</div>
                    <button id="start-game-btn">Start Game</button>
                    <button id="reset-game-btn">Reset Game</button>
                </div>
                <div id="player-panel">
                    <h2>Player Controls</h2>
                    <div id="player-status" class="status">Connected as player</div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module" src="game.js"></script>

</body>
</html>
